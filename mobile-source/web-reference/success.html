<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment confirmed — PharmDPrepped</title>
<style>
  body{
    font-family: 'Source Serif 4', Georgia, serif;
    background: #F2F4F3;
    color: #12213B;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  .card{
    max-width: 420px;
    background: white;
    border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 20px 60px rgba(18,33,59,0.15);
  }
  h1{ font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin-bottom: 12px; }
  p{ color: #5A6B85; font-size: 15px; line-height: 1.6; }
  .spinner{
    width: 32px; height: 32px; margin: 20px auto;
    border: 3px solid #E0E4E8; border-top-color: #0F7D80;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .error{ color: #C0392B; }
  a.btn{
    display: inline-block; margin-top: 16px; padding: 12px 24px;
    background: #0F7D80; color: white; text-decoration: none;
    border-radius: 9px; font-family: 'Space Grotesk', sans-serif; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card" id="statusCard">
    <div class="spinner"></div>
    <h1>Confirming your payment...</h1>
    <p>This will only take a moment.</p>
  </div>

  <script>
    async function confirmPayment(){
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      const card = document.getElementById('statusCard');

      if(!sessionId){
        card.innerHTML = '<h1 class="error">No payment session found</h1><p>Please try purchasing again from the homepage.</p><a class="btn" href="/index.html">Back to homepage</a>';
        return;
      }

      try{
        const res = await fetch(`/api/verify-session?session_id=${encodeURIComponent(sessionId)}`);
        const data = await res.json();

        if(data.valid && data.token){
          localStorage.setItem('pharmd_access_token', data.token);
          card.innerHTML = '<h1>You\'re all set</h1><p>Payment confirmed. Taking you into PharmDPrepped now...</p>';
          setTimeout(function(){
            window.location.href = '/index.html?entering=1';
          }, 1200);
        } else {
          card.innerHTML = '<h1 class="error">Payment not confirmed</h1><p>We could not verify this payment. If you were charged, please contact support.</p><a class="btn" href="/index.html">Back to homepage</a>';
        }
      }catch(e){
        card.innerHTML = '<h1 class="error">Something went wrong</h1><p>Please contact support if you were charged.</p><a class="btn" href="/index.html">Back to homepage</a>';
      }
    }
    confirmPayment();
  </script>
</body>
</html>
